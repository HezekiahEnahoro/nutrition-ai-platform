services:
  - type: web
    name: nutrition-ai-backend
    env: python
    region: ohio
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --workers 2 --threads 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "nutrition-ai-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://nutrition-ai.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nutrition-ai.vercel.app"
      - key: CROSS_SITE_PROD
        value: "True"
      - key: USE_OPENAI
        value: "True"
      - key: OPENAI_API_KEY
        sync: false
      - key: USE_GROQ
        value: "False"
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nutrition-ai-db
          property: connectionString

databases:
  - name: nutrition-ai-db
    plan: free
    region: ohio
